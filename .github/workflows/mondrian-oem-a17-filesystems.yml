name: Xiaomi OEM mondrian AOSP17 EROFS/F2FS kernel Kconfig

on:
  push:
    branches: [bringup/a17-mondrian-xiaomi-oem-base-20261109]
    paths:
      - 'arch/arm64/configs/vendor/mondrian_GKI.config'
      - 'tools/verify_mondrian_oem_eroFS.py'
      - '.github/workflows/mondrian-oem-a17-filesystems.yml'
  pull_request:
    paths:
      - 'arch/arm64/configs/vendor/mondrian_GKI.config'
      - 'tools/verify_mondrian_oem_eroFS.py'
      - '.github/workflows/mondrian-oem-a17-filesystems.yml'

permissions:
  contents: read

jobs:
  real-oem-kconfig:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout full official-Xiaomi-derived PE kernel source
        uses: actions/checkout@v4
      - name: Install HOST Kconfig dependencies only (not target kernel toolchain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            make gcc bison flex bc libssl-dev
      - name: Validate real Xiaomi kernel Kconfig implementation
        run: python3 tools/verify_mondrian_oem_eroFS.py
      - name: Generate GKI .config plus OEM mondrian fragment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oem-mondrian-config"
          make O="$RUNNER_TEMP/oem-mondrian-config" ARCH=arm64 gki_defconfig
          bash scripts/kconfig/merge_config.sh -m -r \
            -O "$RUNNER_TEMP/oem-mondrian-config" \
            "$RUNNER_TEMP/oem-mondrian-config/.config" \
            arch/arm64/configs/vendor/mondrian_GKI.config
          make O="$RUNNER_TEMP/oem-mondrian-config" ARCH=arm64 olddefconfig
      - name: Check what actual Kconfig accepted for EROFS/SELinux/F2FS/FBE
        run: |
          python3 tools/verify_mondrian_oem_eroFS.py \
            --generated-config "$RUNNER_TEMP/oem-mondrian-config/.config"
          grep -E '^CONFIG_(EROFS_FS|EROFS_FS_SECURITY|EROFS_FS_ZIP|F2FS_FS|FS_ENCRYPTION|FS_ENCRYPTION_INLINE_CRYPT)=' \
            "$RUNNER_TEMP/oem-mondrian-config/.config" >> "$GITHUB_STEP_SUMMARY"
          echo "OEM-first source/Kconfig verified; no kernel binary, DTBO or AOSP 17 image compiled." >> "$GITHUB_STEP_SUMMARY"
