name: Mondrian AOSP17 trial manifest resolved by official Repo

on:
  push:
    branches: ['audit/a17-mondrian-kernel-bsp-provenance-20261108']
    paths:
      - '.github/workflows/mondrian-bsp-manifest-resolve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-trial-source-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Android Repo client
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
      - name: Verify our AOSP17 source trial resolves with no overlaps
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pe-a17-mondrian"
          cd "$RUNNER_TEMP/pe-a17-mondrian"
          "$RUNNER_TEMP/repo" init --no-clone-bundle -q \
            -u https://github.com/PixelExperience-Reborn/manifest \
            -b bringup/a17-mondrian-audit-profile-20261108 \
            -m aosp17_pe_mondrian_bsp_trial.xml
          "$RUNNER_TEMP/repo" manifest -o "$RUNNER_TEMP/mondrian-merged.xml"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          xml = Path(os.environ["RUNNER_TEMP"]) / "mondrian-merged.xml"
          root = ET.parse(xml).getroot()
          entries = root.findall("project")
          by_path = {}
          for node in entries:
              path = node.get("path") or node.get("name")
              assert path not in by_path, f"duplicate checkout path {path}"
              by_path[path] = node
          expected = {
              "kernel/xiaomi/sm8450": "283772ceb84491fd446e340fd211d45fb9dd9a36",
              "kernel/xiaomi/sm8450-modules": "91cdb1347970ae98291986926eb16bf1b172138e",
              "kernel/xiaomi/sm8450-devicetrees": "99f1330d8dce0c80de5a19f425d0a118b2eb7fe3",
          }
          for path, rev in expected.items():
              assert path in by_path, f"missing {path}"
              assert by_path[path].get("revision") == rev, f"incorrect SHA for {path}"
          for path in ("device/xiaomi/mondrian", "device/xiaomi/sm8450-common",
                       "vendor/aosp", "build/make"):
              assert path in by_path, f"missing AOSP17 PE product input {path}"
          for path in ("vendor/xiaomi/mondrian",
                       "vendor/xiaomi/sm8450-common", "hardware/xiaomi"):
              assert path not in by_path, f"unqualified vendor or HAL {path}"
          print(f"[PASS] official Repo parsed {len(entries)} projects, 3 immutable BSP source trees")
          print("[NOTE] no sync, no Image, boot.img, dtbo.img, modules, KMI, AVB or hardware qualification")
          PY
