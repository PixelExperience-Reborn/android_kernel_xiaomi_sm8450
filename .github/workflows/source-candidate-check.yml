name: Mondrian kernel source candidate contracts (metadata only)

on:
  push:
    branches: [seventeen, 'audit/**']
  pull_request:

jobs:
  source-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source inventory and no-build claims
        run: python3 -m unittest discover -s tests -v
