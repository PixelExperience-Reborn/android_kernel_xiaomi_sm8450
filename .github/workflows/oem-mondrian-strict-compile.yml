name: OEM mondrian strict kernel compile with official Android Clang 23

on:
  push:
    branches:
      - bringup/a17-mondrian-xiaomi-oem-base-20261109
    paths:
      - '.github/workflows/oem-mondrian-strict-compile.yml'
      - 'tools/fetch_android_kernel_clang.sh'
      - 'arch/arm64/configs/vendor/mondrian_GKI.config'
      - 'drivers/**'
      - 'fs/**'
      - 'kernel/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mondrian-oem-strict-compile
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host build dependencies only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex make libssl-dev libelf-dev dwarves
      - name: Obtain pinned Google Android Clang r614150
        run: |
          bash -n tools/fetch_android_kernel_clang.sh
          bash tools/fetch_android_kernel_clang.sh "$RUNNER_TEMP/google-clang"
          echo "$RUNNER_TEMP/google-clang/clang-r614150/bin" >> "$GITHUB_PATH"
      - name: Assert compiler identity and OEM kernel source
        run: |
          set -euo pipefail
          test "$(readlink -f "$(command -v clang)")" = \
            "$RUNNER_TEMP/google-clang/clang-r614150/bin/clang"
          clang --version | head -1 | grep -E 'clang version 23[.]'
          test -f build.config.msm.mondrian
          grep -Fx 'SUBLEVEL = 81' Makefile
          test -f drivers/misc/hwid/hwid.c
      - name: Generate actual OEM mondrian GKI kernel configuration
        run: |
          set -euo pipefail
          export LLVM=1 LLVM_IAS=1 ARCH=arm64
          mkdir -p "$RUNNER_TEMP/mondrian-out"
          make O="$RUNNER_TEMP/mondrian-out" gki_defconfig
          bash scripts/kconfig/merge_config.sh -m -r \
            -O "$RUNNER_TEMP/mondrian-out" \
            "$RUNNER_TEMP/mondrian-out/.config" \
            arch/arm64/configs/vendor/mondrian_GKI.config
          make O="$RUNNER_TEMP/mondrian-out" olddefconfig
          python3 tools/verify_mondrian_oem_eroFS.py \
            --generated-config "$RUNNER_TEMP/mondrian-out/.config"
      - name: Strictly compile OEM Linux kernel with LLVM23
        run: |
          set -euo pipefail
          export LLVM=1 LLVM_IAS=1 ARCH=arm64
          # No -Wno-error, no forced frame-warning bypass, no fake .ko.
          make O="$RUNNER_TEMP/mondrian-out" -j3 vmlinux \
            2>&1 | tee "$RUNNER_TEMP/mondrian-kernel-compile.log"
          test -s "$RUNNER_TEMP/mondrian-out/vmlinux"
          echo "[PASS] Strict OEM kernel ELF compile with Android Clang 23" >> "$GITHUB_STEP_SUMMARY"
          echo "[NOT VERIFIED] external Qualcomm modules, DTBO, KMI, boot.img, and Android17 device boot" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve diagnostic config and compiler messages only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oem-mondrian-strict-compile-evidence
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/mondrian-out/.config
            ${{ runner.temp }}/mondrian-kernel-compile.log
